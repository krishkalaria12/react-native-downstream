packages:
  - example
  - math
  - code
  - site
allowBuilds:
  lefthook: false
  # esbuild's postinstall places the platform binary vite and vitest load. Without
  # it a clean install fails before any test runs.
  esbuild: true
  # Its postinstall downloads highlighter grammars. The example keeps highlighting
  # off so CI and fresh clones build without them; the phone benchmark enables it
  # and runs the download itself for its highlighted APK.
  react-native-enriched-markdown: false
  # Wrangler's local runtime. Its postinstall only re-checks the platform binary that
  # pnpm already installs, and deploys do not use it.
  workerd: false
minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@4.0.100'
  - '@ai-sdk/openai@4.0.80'
  - '@ai-sdk/provider-utils@5.0.51'
  - '@ai-sdk/provider@4.0.19'
  - ai@7.0.122
patchedDependencies:
  # SDK 55 links libworklets.so from intermediates/cmake/, which AGP 8 no longer
  # writes, so the example's Android build fails in Debug and Release. This
  # backports SDK 56's lookup through worklets' prefab package; drop it with 56.
  expo-modules-core@55.0.26: patches/expo-modules-core@55.0.26.patch
  metro@0.83.8: patches/metro@0.83.8.patch

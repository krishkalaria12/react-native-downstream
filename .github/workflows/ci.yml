name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: pnpm lint

      - name: Typecheck files
        run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    env:
      DOWNSTREAM_ENGINE_CACHE: ${{ github.workspace }}/.native-test-build-cache

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore native test builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DOWNSTREAM_ENGINE_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-engine-unit-v2-${{ hashFiles('src/cpp/**', 'tests/engine.ts', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-engine-unit-v2-
            ${{ runner.os }}-${{ runner.arch }}-engine-host-v2-

      - name: Run unit tests
        run: pnpm test

  test-native:
    runs-on: ubuntu-latest
    env:
      DOWNSTREAM_ENGINE_CACHE: ${{ github.workspace }}/.native-test-build-cache

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The host suite uses only Node built-ins and the system compiler. pnpm is
      # never installed here, so the package-manager cache, which setup-node turns
      # on from package.json's packageManager field, would fail looking for it.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Restore native test builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DOWNSTREAM_ENGINE_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-engine-host-v2-${{ hashFiles('src/cpp/**', 'tests/engine.ts', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-engine-host-v2-
            ${{ runner.os }}-${{ runner.arch }}-engine-unit-v2-

      - name: Run native engine tests
        run: node --test src/cpp/tests/engine.test.mjs

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: pnpm prepare

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build example for Web
        run: |
          pnpm --filter react-native-downstream-example exec expo export --platform web

name: CI
on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
    types:
      - checks_requested

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: pnpm lint

      - name: Typecheck files
        run: pnpm typecheck

      # The fabric and session C++ is compiled by Xcode and Gradle inside React
      # Native's build, against headers that exist only there. This parses them
      # against the headers in node_modules, which is where a signature React
      # Native's bridging cannot call gets caught.
      - name: Check the fabric and session C++
        run: pnpm test:fabric

  test:
    runs-on: ubuntu-latest
    env:
      DOWNSTREAM_ENGINE_CACHE: ${{ github.workspace }}/.native-test-build-cache

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore native test builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DOWNSTREAM_ENGINE_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-engine-unit-v2-${{ hashFiles('src/cpp/**', 'tests/engine.ts', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-engine-unit-v2-
            ${{ runner.os }}-${{ runner.arch }}-engine-host-v2-

      - name: Run unit tests
        run: pnpm test

  test-native:
    runs-on: ubuntu-latest
    env:
      DOWNSTREAM_ENGINE_CACHE: ${{ github.workspace }}/.native-test-build-cache

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # The host suite uses only Node built-ins and the system compiler. pnpm is
      # never installed here, so the package-manager cache, which setup-node turns
      # on from package.json's packageManager field, would fail looking for it.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Restore native test builds
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.DOWNSTREAM_ENGINE_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-engine-host-v2-${{ hashFiles('src/cpp/**', 'tests/engine.ts', '.nvmrc') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-engine-host-v2-
            ${{ runner.os }}-${{ runner.arch }}-engine-unit-v2-

      - name: Run native engine tests
        run: node --test src/cpp/tests/engine.test.mjs

  # The Kotlin mirror of CodeLayout.h answers the same case table as the engine,
  # so a drift between the two copies fails here rather than on a device.
  test-kotlin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      # Node built-ins only, as in test-native, so pnpm is never installed.
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      # The runner image ships kotlinc; fetch a pinned compiler only if it stops.
      - name: Ensure a Kotlin compiler
        run: |
          if ! command -v kotlinc >/dev/null; then
            curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" \
              https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
            unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
            echo "KOTLIN_HOME=$RUNNER_TEMP/kotlinc" >> "$GITHUB_ENV"
          fi

      - name: Run Kotlin layout checks
        run: node tests/android/run.mjs

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: pnpm prepare

  build-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build example for Web
        run: |
          pnpm --filter react-native-downstream-example exec expo export --platform web

name: iOS native
on:
  push:
    branches: [main]
    paths:
      - 'src/ios/**'
      - 'src/cpp/**'
      - '!src/cpp/tests/**'
      - '!src/cpp/**/*.md'
      - '!src/cpp/**/*.mjs'
      - 'src/specs/**'
      - 'src/Native*.ts'
      - 'src/*NativeComponent.ts'
      - '*.podspec'
      - 'example/app.json'
      - 'example/package.json'
      - 'example/plugins/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'patches/**'
      - 'react-native.config.js'
      - '.github/actions/setup/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'src/ios/**'
      - 'src/cpp/**'
      - '!src/cpp/tests/**'
      - '!src/cpp/**/*.md'
      - '!src/cpp/**/*.mjs'
      - 'src/specs/**'
      - 'src/Native*.ts'
      - 'src/*NativeComponent.ts'
      - '*.podspec'
      - 'example/app.json'
      - 'example/package.json'
      - 'example/plugins/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - 'patches/**'
      - 'react-native.config.js'
      - '.github/actions/setup/**'
      - '.github/workflows/ios.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restore CocoaPods downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
          key: ${{ runner.os }}-${{ runner.arch }}-pods-v1-${{ hashFiles('pnpm-lock.yaml', '*.podspec') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pods-v1-

      - name: Generate iOS project
        run: pnpm --filter react-native-downstream-example exec expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: example/ios
        run: pod install

      # Build the pod and its dependencies without packaging or signing the app.
      - name: Compile native library
        run: >-
          xcodebuild -project example/ios/Pods/Pods.xcodeproj -scheme Downstream
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/downstream-ios-build"
          CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO -jobs 3 build
